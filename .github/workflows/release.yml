name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Publish to npm with provenance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance (Sigstore signing via GitHub OIDC)
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) requires npm >= 11.5
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      # Authenticates via npm trusted publishing (GitHub OIDC) — no token
      # needed. Provenance is generated automatically.
      - name: Publish
        run: npm publish --access public
