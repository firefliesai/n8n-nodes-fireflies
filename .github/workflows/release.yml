name: Release

# Merging a version bump to main publishes it: npm first, then the vX.Y.Z tag
# and GitHub release, with notes from .github/release-notes/<version>.md.
# Every step is skipped when already done, so a push without a version bump is
# a no-op and a failed run can be re-run (or dispatched) safely.
on:
  push:
    branches: [main]
  workflow_dispatch:

# npm publishes are not idempotent — queue overlapping runs instead of racing
concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions: {}

jobs:
  check:
    name: Check what needs releasing
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.state.outputs.version }}
      published: ${{ steps.state.outputs.published }}
      released: ${{ steps.state.outputs.released }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Read version and release state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Empty output = version not on npm; a registry error fails the step
          if [ -n "$(npm view "$NAME@$VERSION" version)" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate release notes
        if: steps.state.outputs.released == 'false'
        run: .github/release-notes/check.sh

  build:
    name: Build package
    needs: check
    if: needs.check.outputs.published == 'false'
    runs-on: ubuntu-latest
    permissions:
      # Read-only checkout; no OIDC here so dependency install and build
      # scripts never run in a job that can mint a publish token
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build and lint
        run: npm run prepublishOnly

      - name: Pack
        run: npm pack

      - name: Upload package tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package
          path: '*.tgz'
          if-no-files-found: error

  publish:
    name: Publish to npm with provenance
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Required for trusted publishing and provenance (Sigstore via GitHub
      # OIDC). This job only touches the prebuilt tarball — no checkout, no
      # dependency install, no lifecycle scripts.
      id-token: write
    steps:
      - name: Download package tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) requires npm >= 11.5; pinned exact version
      - name: Update npm
        run: npm install -g npm@11.6.2

      # Authenticates via npm trusted publishing (GitHub OIDC) — no token
      # secret. --provenance makes the publish fail if the provenance
      # statement cannot be generated. --ignore-scripts because the tarball
      # is already built; prepublishOnly ran in the build job.
      - name: Publish
        run: npm publish ./*.tgz --provenance --access public --ignore-scripts

  github-release:
    name: Create GitHub release
    needs: [check, publish]
    # Runs after a successful publish, or when npm already had the version
    # (publish skipped) but the release is still missing
    if: >-
      always() &&
      needs.check.result == 'success' &&
      needs.check.outputs.released == 'false' &&
      (needs.publish.result == 'success' || needs.check.outputs.published == 'true')
    runs-on: ubuntu-latest
    permissions:
      # Creates the tag and the release. Only reads files — no install, no build.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          TAG="v$VERSION"
          TITLE="$(.github/release-notes/check.sh)"
          NOTES="$RUNNER_TEMP/notes.md"

          tail -n +2 ".github/release-notes/$VERSION.md" > "$NOTES"

          # Pull request list and Full Changelog link from GitHub's generator
          GENERATED="$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" --jq .body)"
          printf '\n---\n\n%s\n' "$GENERATED" >> "$NOTES"

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file "$NOTES" \
            --latest
