name: Release

on:
  release:
    types: [published]

# npm publishes are not idempotent — queue overlapping runs instead of racing
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    permissions:
      # Read-only checkout; no OIDC here so dependency install and build
      # scripts never run in a job that can mint a publish token
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Verify release tag matches package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "Release tag '$TAG' does not match package version '$VERSION'" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build and lint
        run: npm run prepublishOnly

      - name: Pack
        run: npm pack

      - name: Upload package tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package
          path: '*.tgz'
          if-no-files-found: error

  publish:
    name: Publish to npm with provenance
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Required for trusted publishing and provenance (Sigstore via GitHub
      # OIDC). This job only touches the prebuilt tarball — no checkout, no
      # dependency install, no lifecycle scripts.
      id-token: write
    steps:
      - name: Download package tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) requires npm >= 11.5; pinned exact version
      - name: Update npm
        run: npm install -g npm@12.0.1

      # Authenticates via npm trusted publishing (GitHub OIDC) — no token
      # secret. --provenance makes the publish fail if the provenance
      # statement cannot be generated. --ignore-scripts because the tarball
      # is already built; prepublishOnly ran in the build job.
      - name: Publish
        run: npm publish ./*.tgz --provenance --access public --ignore-scripts
